<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwtFrontend — Login</title>
    <link rel="stylesheet" href="/dashboard/style.css">
    <link rel="icon" href="/dashboard/favicon.svg" type="image/svg+xml">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <h1>SwtFrontend</h1>
            <p>Dashboard de Gerenciamento</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" autocomplete="current-password">
                </div>
                <div id="login-error" class="error hidden"></div>
                <button type="submit" class="btn-primary btn-full">Entrar</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('login-error');
            errorEl.classList.add('hidden');
            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await resp.json();
                if (data.success) {
                    window.location.href = '/';
                } else {
                    errorEl.textContent = data.error || 'Credenciais inválidas';
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.textContent = 'Erro de conexão';
                errorEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
